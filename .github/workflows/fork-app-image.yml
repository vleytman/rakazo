name: fork-app-image

# Builds the app image of this fork for the self-hosted server (x86_64 only) and tags it
# sha-<commit> and custom. Started by ./ship build; the upstream publish workflow builds three
# images for two architectures, which this server does not need.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-app-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/compose/Dockerfile
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/app:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/app:custom
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=fork-app-amd64
          cache-to: type=gha,mode=max,scope=fork-app-amd64
          provenance: false
          sbom: false
